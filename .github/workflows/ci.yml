# CI پروژه Makan Store — اجرا روی push به main و شاخه‌های کاری feat/** و pull request به main
# (گسترش trigger — بخش E فاز ۱: از این پس هر push روی شاخه‌های feat/** هم CI کامل می‌گیرد)
# مراحل: نصب → typecheck → lint → تست واحد (بدون دیتابیس) → PostgreSQL موقت →
#        تست یکپارچه → build → seed → سرور پروداکشن → تست دود (smoke.sh)
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # DATABASE_URL برای مراحل دیتابیسی — تست‌های یکپارچه، build و smoke
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/makan_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/makan_test
      ADMIN_PASSWORD: Admin#1404        # رمزهای مورد انتظار smoke.sh
      DEMO_USERS_PASSWORD: Demo#1404

    # PostgreSQL موقت برای تست‌های یکپارچه و smoke — پس از پایان job از بین می‌رود
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: makan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Next.js 16 به Node ≥ 20.9 نیاز دارد — از LTS فعلی (22) استفاده می‌کنیم
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # تست‌های واحد — hermetic، بدون نیاز به دیتابیس
      - name: Unit tests
        run: npm run test:unit

      # ساخت اسکیمای دیتابیس موقت برای تست‌های یکپارچه
      - name: Prepare test database
        run: npx prisma db push --skip-generate

      # تست‌های وابسته به دیتابیس (لایه AI، جریان سفارش ویزیتور)
      
      - name: Generate Prisma Client
        run: npx prisma generate
      
      - name: Integration tests
        run: npm run test:integration

      # build بدون ignoreBuildErrors — خطای تایپ جدید CI را قرمز می‌کند
      - name: Build
        run: npm run build

      # داده‌های اولیه برای تست دود (اعداد smoke.sh به seed تازه وابسته‌اند)
      - name: Seed database
        run: npm run db:seed

      - name: Start production server
        run: |
          nohup npm run start:standalone > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api > /dev/null || (cat /tmp/server.log && exit 1)

      # تست دود کامل — ۳۶+ چک روی سناریوهای حیاتی (شامل جریان سفارش ویزیتور)
      - name: Smoke test
        run: bash scripts/smoke.sh
